[package]
name = "browser-picker"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Choose where links and local files open"
repository = "https://github.com/TheAnachronism/linux-browser-picker"
rust-version = "1.92"

[dependencies]
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
gtk = { package = "gtk4", version = "0.11.4" }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_6"] }
