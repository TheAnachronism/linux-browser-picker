[package]
name = "browser-picker"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Choose where links and local files open"
repository = "https://github.com/TheAnachronism/linux-browser-picker"
rust-version = "1.92"

[dependencies]
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_6"] }
gio = { version = "0.22.9", features = ["v2_80"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"
url = "2.5.7"
idna = "1.1.0"
regex = "1.13.1"
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.23.0"
